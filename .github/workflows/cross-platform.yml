name: Cross-platform runtime

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux
          - name: macOS
            os: macos-latest
            platform: macos
          - name: Windows
            os: windows-latest
            platform: windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux MIDI build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify native runtime backends
        run: npm run check:runtime-backends

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
